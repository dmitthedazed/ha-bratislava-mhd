name: Feature request
description: An idea for the integration or the card
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: What you want to do and how it would look or work.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The situation where you'd use it.
